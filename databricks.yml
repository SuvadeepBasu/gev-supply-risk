# Step 5: deploy everything with one command:  databricks bundle deploy -t dev
bundle:
  name: gev-supply-risk

variables:
  catalog:
    description: Unity Catalog that holds ref, ops, bronze, silver and gold schemas
    default: supply_risk_dev

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://adb-<workspace-id>.<n>.azuredatabricks.net
  prod:
    mode: production
    variables:
      catalog: supply_risk
    # workspace:
    #   host: https://adb-<workspace-id>.<n>.azuredatabricks.net

resources:
  jobs:
    supply_risk_setup:
      name: "[supply-risk] 1. setup + sample data"
      tasks:
        - task_key: load_sample_data
          spark_python_task:
            python_file: ./src/jobs/load_sample_data.py
            parameters: ["--catalog", "${var.catalog}"]
          environment_key: default
        - task_key: first_risk_run
          depends_on: [{ task_key: load_sample_data }]
          spark_python_task:
            python_file: ./src/jobs/run_risk_engine.py
            parameters: ["--catalog", "${var.catalog}", "--with-genie-functions"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"

    supply_risk_refresh:
      name: "[supply-risk] 2. refresh hazards + risk"
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED   # unpause once real hazard feeds are wanted
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_hazards
          spark_python_task:
            python_file: ./src/jobs/ingest_hazards.py
            parameters: ["--catalog", "${var.catalog}"]
          environment_key: default
        - task_key: run_risk_engine
          depends_on: [{ task_key: ingest_hazards }]
          spark_python_task:
            python_file: ./src/jobs/run_risk_engine.py
            parameters: ["--catalog", "${var.catalog}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
